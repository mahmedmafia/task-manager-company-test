<div class="card mt-3 p-3">
  <h5>Recent Activity Feed</h5>
  <div class="table-responsive">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Task ID</th>
          <th>Task Title</th>
          <th>Action</th>
          <th>Action Date</th>
        </tr>
      </thead>
      <tbody>
        @defer () {
        <tr *ngFor="let item of feed()">
          <td>{{ item.taskId }}</td>
          <td>{{ item.taskTitle }}</td>
          <td>
            <span class="badge" [ngClass]="{
                'bg-primary': item.action === 'created',
                'bg-warning text-dark': item.action === 'updated',
                'bg-success': item.action === 'completed'
              }">
              {{ item.action | titlecase }}
            </span>
          </td>
          <td>{{ item.date | date: 'short' }}</td>
        </tr>
        }@placeholder {
        <tr *ngFor="let i of [1,2,3,4,5]">
          <td><p-skeleton width="50px" height="16px"></p-skeleton></td>
          <td><p-skeleton width="150px" height="16px"></p-skeleton></td>
          <td><p-skeleton width="80px" height="16px"></p-skeleton></td>
          <td><p-skeleton width="100px" height="16px"></p-skeleton></td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
