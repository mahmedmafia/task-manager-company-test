<div class="task-filter-bar d-flex justify-content-between align-items-center ">
  <div class="task-filter">
    @for(status of statusOptions;track status.value) {
    <button (click)="statusFilter.set(status.value)" [class.active]="statusFilter() === status.value">{{ status.label
      }}</button>
    }
  </div>

  <div class="d-flex ">
    <select (change)="priorityFilter.set($any($event.target).value)">
      @for(priority of priorityOptions; track priority.value) {
      <option [value]="priority.value" [selected]="priorityFilter() === priority.value">{{ priority.label }}
      </option>
      }
    </select>
    <button class="new-task" (click)="addTask()">+ New Task</button>
  </div>


</div>
<div class="board">
  @for(status of statuses(); track status) {
  <app-task-column [title]="status.label" [tasks]="tasks() | taskFilter:status.value:priorityFilter()">
  </app-task-column>
  }
</div>
