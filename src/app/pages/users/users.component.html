<div class="row p-fluid">
  <div class="col-12">
    <div class="card p-2">
      <div class="d-flex justify-content-end flex-row">
        <button class="add" pButton pRipple label="add" (click)="update()" icon="pi pi-plus"></button>
      </div>
      <hr>
      <p-table [value]="users()" [sortOrder]="sortField().order" [sortField]="sortField().field" styleClass="p-datatable-striped" [tableStyle]="{ 'min-width': '30rem' }"
        [rowHover]="true" currentPageReportTemplate="showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true" [totalRecords]="users().length" [rows]="10" [paginator]="users().length" >
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="name" style="width:20%">
              Name <p-sortIcon field="name" />
            </th>
            <th  pSortableColumn="email" style="width:20%">
              Email <p-sortIcon field="email" />
            </th>

            <th  (click)="onCustomSort('assignedTasks')" pSortableColumn="assignedTasks">Assigned Tasks <p-sortIcon field="assignedTasks" /></th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-user>
          <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>
              {{getAssignedTasksCount(user.id)}}
            </td>
            <td class="td_operations">
              <div class="div_operations  d-flex justify-content-center">
                <button pButton type="button" pTooltip="edit" class=" p-button-info info-button"
                  icon="pi pi-pen-to-square" (click)="update(user)"></button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>

    </div>
  </div>
</div>
